worker_processes auto;

events {
  # ~200 concurrent users each hold a websocket plus short-lived HTTP requests.
  worker_connections 4096;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  tcp_nopush      on;
  keepalive_timeout 65;
  server_tokens   off;

  # The 50MB submission videos are streamed straight to the API instead of being
  # buffered to disk by nginx first.
  client_max_body_size 60m;
  client_body_timeout  300s;
  proxy_request_buffering off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css application/json application/javascript
             application/x-javascript text/xml application/xml image/svg+xml;

  # When something else terminates TLS in front of this (Dokploy/Traefik, a cloud
  # LB), every request arrives from that proxy's container IP. Without this,
  # $remote_addr is the proxy for ALL clients, which would (a) collapse ip_hash
  # so every user pins to one replica and (b) make IP rate limiting global.
  # Only private ranges are trusted, so a public client cannot forge the header.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from fc00::/7;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  log_format main '$remote_addr - $upstream_addr [$time_local] "$request" '
                  '$status $body_bytes_sent $request_time "$http_user_agent"';
  # Written to the shared logs volume so it outlives the container, alongside
  # the API's audit-*.jsonl trail.
  access_log /var/log/scratch/nginx-access.log main;

  upstream api_upstream {
    # Sticky by client IP. Socket.IO falls back to HTTP long-polling when a
    # websocket cannot be established, and long-polling breaks if consecutive
    # requests from one client land on different replicas.
    #
    # least_conn, not ip_hash: behind Cloudflare AND a venue NAT every request
    # arrives from effectively one address, so hashing on it pins the entire
    # event to a single replica (measured in production - api-2 served 20/20
    # health checks while api-1 idled).
    #
    # This is only safe because the client is pinned to websockets in
    # apps/web/src/lib/socket.js. Socket.IO's HTTP long-polling fallback needs
    # every request of a session on the same replica; a websocket is one
    # connection, so it does not.
    least_conn;

    server api-1:5001 max_fails=3 fail_timeout=10s;
    server api-2:5001 max_fails=3 fail_timeout=10s;
  }

  server {
    listen 80;
    server_name _;

    location = /healthz {
      access_log off;
      return 200 "ok\n";
    }

    # Uploaded videos come off the shared volume directly - no reason to wake a
    # Node process to stream a 50MB file.
    # Uploaded filenames are unique and never rewritten, so they can be cached
    # hard - a judge rewatching a clip does not re-download 50MB.
    location ~* ^/uploads/videos/[^/]+\.(mp4|webm|mov|mkv)$ {
      root /var/www;
      autoindex off;
      expires 30d;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options "nosniff";
      try_files $uri =404;
    }

    # Anything else under /uploads is not a video we wrote. Refuse to serve it
    # rather than hand a browser something it might execute on this origin.
    location /uploads/ {
      return 404;
    }

    # Operations dashboard, served by the API behind its own HTTP Basic auth.
    # Kept off /api so it is excluded from the app's limiter, audit trail and
    # request metrics - watching the dashboard must not distort what it shows.
    location /god {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    location /api/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location /socket.io/ {
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Must exceed Socket.IO's ping interval or idle sockets get culled.
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_buffering off;
    }

    location /assets/ {
      root /usr/share/nginx/html;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }
  }
}
